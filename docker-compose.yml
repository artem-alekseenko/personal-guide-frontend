services:
  proto:
    build:
      context: .
      args:
        VUEFIRE_API_KEY: ${VUEFIRE_API_KEY:-}
        VUEFIRE_AUTH_DOMAIN: ${VUEFIRE_AUTH_DOMAIN:-}
        VUEFIRE_PROJECT_ID: ${VUEFIRE_PROJECT_ID:-}
        VUEFIRE_STORAGE_BUCKET: ${VUEFIRE_STORAGE_BUCKET:-}
        VUEFIRE_MESSAGING_SENDER_ID: ${VUEFIRE_MESSAGING_SENDER_ID:-}
        VUEFIRE_APP_ID: ${VUEFIRE_APP_ID:-}
        RECAPTCHA_KEY: ${RECAPTCHA_KEY:-}
        NUXT_PUBLIC_MAPBOX_GL_ACCESS_TOKEN: ${NUXT_PUBLIC_MAPBOX_GL_ACCESS_TOKEN:-}
    container_name: proto
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NUXT_PG_API_BASE_URL: ${DOCKER_PG_API_BASE_URL:-http://host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
